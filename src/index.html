<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Navegador Carlinho</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="browser-container">
        <header id="toolbar">
            <div id="nav-buttons">
                <button id="btn-back" title="Voltar">◄</button>
                <button id="btn-forward" title="Avançar">►</button>
                <button id="btn-reload" title="Recarregar">↻</button>
                <button id="btn-home" title="Início">🏠</button>
            </div>
            <div id="url-bar-container">
                <input type="text" id="url-input" placeholder="Digite uma URL (ex: https://github.com) ou pesquise">
            </div>
        </header>
        <main id="view-container">
            <iframe id="browser-frame" src="https://www.google.com" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
