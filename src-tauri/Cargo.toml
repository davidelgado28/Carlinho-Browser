[package]
name = "navegador-carlinho"
version = "0.1.0"
description = "Navegador Carlinho Tauri Edition"
authors = ["You"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["window-minimize", "window-maximize", "window-close", "protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
