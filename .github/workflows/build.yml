name: Carlinho Browser CI/CD Release

on:
  push:
    tags:
      - 'v*' 

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build Executable (PyInstaller)
        run: pyinstaller --noconsole --onefile --name "CarlinhoBrowser" main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: CarlinhoBrowser-${{ matrix.os }}
          path: dist/*

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node & Java
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install React Native Deps
        run: npm install

      - name: Build Android Release (APK)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: CarlinhoBrowser-Android
          path: android/app/build/outputs/apk/release/app-release.apk

  publish-release:
    name: Create GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/CarlinhoBrowser-windows-latest/*
            artifacts/CarlinhoBrowser-ubuntu-latest/*
            artifacts/CarlinhoBrowser-macos-latest/*
            artifacts/CarlinhoBrowser-Android/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
