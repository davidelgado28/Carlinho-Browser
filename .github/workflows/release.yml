name: Carlinho Browser Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.13'
  JAVA_VERSION: '17'

jobs:
  desktop:
    name: Desktop - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-python@v7
        with: 
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Configure Qt
        run: python -m pip install --upgrade pip pyside6
        
      - name: Configure
        shell: bash
        run: cmake -S desktop -B build -DCMAKE_BUILD_TYPE=Release -DCARLINHO_VERSION=${GITHUB_REF_NAME}
        
      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel
        
      - name: Deploy Windows Qt
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          windeployqt --release --no-translations build/Release/carlinho-browser.exe --dir dist
          Copy-Item build/Release/carlinho-browser.exe dist/
          Compress-Archive -Path dist/* -DestinationPath "CarlinhoBrowser-${env:GITHUB_REF_NAME}-windows-x64.zip"
          
      - name: Deploy macOS Qt
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p dist
          macdeployqt build/carlinho-browser.app -always-overwrite
          cp -R build/carlinho-browser.app dist/CarlinhoBrowser.app
          hdiutil create -volname "Carlinho Browser" -srcfolder dist/CarlinhoBrowser.app -ov -format UDZO "CarlinhoBrowser-${GITHUB_REF_NAME}-macos.dmg"
          
      - name: Deploy Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p dist/AppDir/usr/bin
          cp build/carlinho-browser dist/AppDir/usr/bin/
          
          # Baixa as ferramentas oficiais do AppImage
          wget -q https://github.com
          chmod +x linuxdeploy-x86_64.AppImage
          
          # Configura variáveis necessárias e executa o empacotamento portátil
          export OUTPUT="CarlinhoBrowser-${GITHUB_REF_NAME}-linux-x64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir dist/AppDir --output appimage
          
      - uses: actions/upload-artifact@v5
        with:
          name: carlinho-browser-${{ matrix.platform }}
          path: |
            *.zip
            *.dmg
            *.AppImage
          if-no-files-found: warn
          retention-days: 14

  mobile-android:
    name: Mobile - Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          
      - uses: android-actions/setup-android@v3
      
      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci
        
      - name: Build APK and AAB
        working-directory: mobile/android
        run: ./gradlew assembleRelease bundleRelease
        
      - uses: actions/upload-artifact@v5
        with:
          name: carlinho-browser-android
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  mobile-ios:
    name: Mobile - iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
        
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
          
      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci
        
      - name: CocoaPods
        working-directory: mobile/ios
        run: pod install --repo-update
        
      - name: Archive
        working-directory: mobile/ios
        run: |
          xcodebuild -workspace CarlinhoBrowser.xcworkspace -scheme CarlinhoBrowser -configuration Release -sdk iphoneos -archivePath "$RUNNER_TEMP/CarlinhoBrowser.xcarchive" archive
          
      - name: Export IPA
        working-directory: mobile/ios
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CarlinhoBrowser.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist ExportOptions.plist
          
      - uses: actions/upload-artifact@v5
        with:
          name: carlinho-browser-ios
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [desktop, mobile-android, mobile-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Create working directory
        run: mkdir artifacts
        
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**
